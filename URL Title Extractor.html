<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Title Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h2>Meta Title Extractor</h2>
    <textarea id="urlInput" placeholder="Enter URLs (one per line)"></textarea>
    <button onclick="fetchTitles()">Extract Titles</button>
    <button onclick="activateCORP()">Activate CORP</button>
    <table id="resultTable">
        <thead>
            <tr>
                <th>URL</th>
                <th>Meta Title</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        let useCORPProxy = false;
        
        function activateCORP() {
            useCORPProxy = !useCORPProxy;
            alert("CORP Mode: " + (useCORPProxy ? "Activated" : "Deactivated"));
        }

        async function fetchTitles() {
            const urls = document.getElementById('urlInput').value.trim().split('\n');
            const tableBody = document.querySelector('#resultTable tbody');
            tableBody.innerHTML = '';
            
            for (const url of urls) {
                if (url.trim() === '') continue;
                try {
                    const fetchUrl = useCORPProxy 
                        ? `https://corsproxy.io/?${encodeURIComponent(url.trim())}` 
                        : url.trim();
                    
                    const response = await fetch(fetchUrl);
                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const title = doc.querySelector('title') ? doc.querySelector('title').innerText : 'No Title Found';
                    
                    const row = `<tr><td>${url}</td><td>${title}</td></tr>`;
                    tableBody.innerHTML += row;
                } catch (error) {
                    tableBody.innerHTML += `<tr><td>${url}</td><td>Error Fetching Title</td></tr>`;
                }
            }
        }
    </script>
</body>
</html>
